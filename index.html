<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pacman1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Підключаємо шрифти Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- 2. Підключаємо Tailwind CSS через CDN (гарантує роботу стилів без зборки) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 3. Налаштування Tailwind (кольори, шрифти, анімації) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'pixel': ['"Press Start 2P"', 'cursive'],
                        'terminal': ['"VT323"', 'monospace'],
                    },
                    colors: {
                        retro: {
                            bg: '#050505',
                            green: '#00FF00',
                            dimGreen: 'rgba(0, 255, 0, 0.1)',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <title>[ML][IT] Kytsmen Yevhenii</title>
</head>
<body>
<!-- React вставить сайт сюди -->
<div id="root"></div>

<!-- Підключення головного JS файлу -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
